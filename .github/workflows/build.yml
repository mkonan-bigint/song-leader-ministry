name: Publier l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publier
  cancel-in-progress: true

jobs:
  # Version web installable (iPhone, et tout navigateur) + bibliothèque en ligne pour les mises à jour
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Adresse de la bibliothèque en ligne
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "window.SLM_CONFIG = { remoteLibrary: \"https://$OWNER.github.io/$REPO/cantiques.json\" };" > www/config.js
          # nouvelle version du cache hors ligne à chaque publication
          sed -i -E "s/const CACHE = \"slm-[^\"]*\"/const CACHE = \"slm-${{ github.run_number }}\"/" www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # Application Android (APK)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Adresse de la bibliothèque en ligne
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "window.SLM_CONFIG = { remoteLibrary: \"https://$OWNER.github.io/$REPO/cantiques.json\" };" > www/config.js
      - name: Préparer le projet Android
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SIGNED=false" >> $GITHUB_ENV; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<GRADLE
          android {
            signingConfigs { release { storeFile file("release.keystore"); storePassword System.getenv("KEYSTORE_PASSWORD"); keyAlias System.getenv("KEY_ALIAS"); keyPassword System.getenv("KEYSTORE_PASSWORD") } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
          echo "SIGNED=true" >> $GITHUB_ENV
      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../SongLeaderMinistry.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../SongLeaderMinistry.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SongLeaderMinistry-apk
          path: SongLeaderMinistry.apk
      - name: Publier l'APK (lien de téléchargement permanent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Song Leader Ministry 1.0.${{ github.run_number }}
          make_latest: true
          files: SongLeaderMinistry.apk
          body: |
            Application Android Song Leader Ministry.
            Télécharger : SongLeaderMinistry.apk ci-dessous, puis l'ouvrir sur le téléphone (autoriser l'installation depuis cette source).
